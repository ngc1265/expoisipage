<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incumbencias y áreas · Expo UTN 2026</title>
<link rel="stylesheet" href="../css/base.css?v=20260904a">
<style>
.grafo-marco{
  display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:stretch;
  margin-top:26px;
}
@media (max-width:1100px){ .grafo-marco{grid-template-columns:1fr} }

.lienzo{
  position:relative;background:var(--gris);border:1px solid var(--borde);
  border-radius:var(--radio);overflow:hidden;min-height:700px;touch-action:none;cursor:grab;
}
.lienzo.arrastrando{cursor:grabbing}
.lienzo svg{display:block;width:100%;height:100%;min-height:700px}

.arista{stroke:#C3C8D0;stroke-width:2;transition:stroke .2s,stroke-width .2s}
.arista.viva{stroke:var(--rojo);stroke-width:3.5}

.nodo{cursor:pointer}
.nodo circle{
  stroke:#fff;stroke-width:3;
  transition:r .25s cubic-bezier(.2,.8,.3,1), filter .2s, stroke .2s;
}
.nodo:hover circle,.nodo.apuntado circle{stroke:var(--tinta);filter:brightness(1.08)}
.nodo.sel circle{stroke:var(--tinta);stroke-width:5}
.nodo text{
  font-family:var(--tipo);font-weight:700;fill:var(--tinta);
  paint-order:stroke;stroke:#F4F5F7;stroke-width:5px;stroke-linejoin:round;
  pointer-events:none;user-select:none;
}
.nodo.raiz text{font-size:19px}
.nodo.area text{font-size:16px}
.nodo.puesto text{font-size:13.5px;font-weight:600}
.nodo .mas{font-size:22px;font-weight:700;fill:#fff;stroke:none;text-anchor:middle}

.mandos-grafo{
  position:absolute;left:14px;bottom:14px;display:flex;gap:10px;flex-wrap:wrap;z-index:3;
}
.mandos-grafo button{
  min-height:56px;padding:10px 18px;border-radius:100px;cursor:pointer;font:inherit;
  font-size:var(--t-sm);font-weight:600;background:var(--papel);
  border:1px solid var(--borde);color:var(--tinta-2);box-shadow:var(--sombra);
}
.mandos-grafo button:hover{border-color:var(--rojo);color:var(--rojo)}
.pista{
  position:absolute;left:16px;top:16px;z-index:3;font-size:var(--t-sm);
  color:var(--apagado);background:rgba(255,255,255,.86);
  padding:8px 14px;border-radius:100px;pointer-events:none;
}

.ficha{
  background:var(--papel);border:1px solid var(--borde);border-radius:var(--radio);
  padding:26px 26px 30px;align-self:start;position:sticky;top:20px;
}
.ficha .tipo{
  display:inline-block;font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:5px 12px;border-radius:100px;
  background:var(--gris);color:var(--apagado);margin-bottom:14px;
}
.ficha h2{font-size:var(--t-lg);line-height:1.2}
.ficha .rotulo{
  font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--apagado);margin:22px 0 8px;
}
.ficha p{font-size:var(--t-md);color:var(--tinta-2);line-height:1.55}
.ficha .alcance{
  border-left:3px solid var(--borde);padding-left:14px;font-size:var(--t-sm);color:var(--apagado);
}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{
  font-size:var(--t-xs);font-weight:600;padding:7px 13px;border-radius:100px;
  background:var(--gris);color:var(--tinta-2);border:1px solid var(--gris-2);
}
.ficha .ir{
  display:inline-block;margin-top:24px;min-height:56px;padding:16px 24px;
  background:var(--rojo);color:#fff;text-decoration:none;border-radius:100px;
  font-weight:600;font-size:var(--t-sm);
}
.ficha .ir:hover{background:var(--rojo-oscuro)}
.ficha .vacia{color:var(--apagado);font-size:var(--t-md);line-height:1.55}
</style>
</head>
<body>

<section class="portada">
  <div class="envoltorio">
    <p class="epigrafe">04 · Incumbencias y áreas</p>
    <h1 id="t-raiz"></h1>
    <p class="bajada" id="t-resumen"></p>
  </div>
</section>

<section class="bloque">
  <div class="envoltorio">
    <div id="aviso-legal"></div>
    <div class="grafo-marco">
      <div class="lienzo" id="lienzo">
        <p class="pista" id="pista">Tocá un área para abrirla</p>
        <svg id="svg" viewBox="0 0 1320 960" preserveAspectRatio="xMidYMid meet" role="img"
             aria-label="Grafo de áreas y puestos de la carrera">
          <g id="g-aristas"></g>
          <g id="g-nodos"></g>
        </svg>
        <div class="mandos-grafo">
          <button class="accionable" id="b-cerrar">Cerrar el área</button>
          <button class="accionable" id="b-centrar">Recentrar</button>
        </div>
      </div>

      <aside class="ficha" id="ficha" aria-live="polite"></aside>
    </div>

    <div id="lista-accesible" class="visualmente-oculto"></div>
  </div>
</section>

<script src="../js/config.js?v=20260904a"></script>
<script src="../js/comun.js?v=20260904a"></script>
<script src="../js/api.js?v=20260904a"></script>
<script src="../js/editor.js?v=20260904a"></script>
<script src="../datos/incumbencias.js?v=20260904a"></script>
<script src="../datos/plan-estudios.js?v=20260904a"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   Grafo de áreas e incumbencias — estilo explorador de Neo4j.

   Simulación de fuerzas escrita a mano (repulsión + resortes +
   gravedad al centro). Sin librerías: la regla del proyecto es cero
   recursos externos, y d3 son 250 KB que el 16/09 pueden no bajar.

   Apertura progresiva: arranca con la raíz y las 9 áreas. Los puestos
   de un área aparecen recién al tocarla. Con las 40 y pico de golpe
   no se entiende nada.
   ══════════════════════════════════════════════════════════════════ */
EXPO.alCargarDatos(function () {
  var el = EXPO.el, esc = EXPO.esc;
  EXPO.cabecera("Incumbencias y áreas");

  var raiz = window.RAIZ || { nombre: "Carrera", resumen: "" };
  var areas = window.AREAS || [];
  var nota = window.NOTA_LEGAL || null;

  var hR = document.getElementById("t-raiz");
  hR.textContent = raiz.nombre;
  EXPO.ligar && EXPO.ligar(hR, "RAIZ.nombre");
  var pR = document.getElementById("t-resumen");
  pR.textContent = raiz.resumen || "";
  EXPO.ligar && EXPO.ligar(pR, "RAIZ.resumen", { multilinea: true });
  if (nota && nota._pendiente) {
    document.getElementById("aviso-legal")
      .appendChild(EXPO.pendiente("Falta el texto oficial", nota._pendiente));
  }

  /* ── Materias: para mostrar el nombre en vez del número ────── */
  var nombreMateria = {};
  (window.MATERIAS || []).forEach(function (m) { nombreMateria[m.id] = m.n; });

  /* ── Construcción del modelo ──────────────────────────────── */
  var W = 1320, H = 960, CX = W / 2, CY = H / 2;
  var RX = 460, RY = 282;          /* elipse donde viven las áreas    */
  var R2X = 735, R2Y = 408;        /* elipse base de los puestos      */
  var nodos = [], aristas = [];

  function agregar(n) {
    /* Valores provisorios hasta que construir() mida el texto de verdad. */
    n.anchoTexto = Math.max(n.r * 2, n.nombre.length * 4.6);
    n.altoTexto = 34;
    nodos.push(n);
    return n;
  }

  var nRaiz = agregar({
    id: "raiz", tipo: "raiz", nombre: raiz.nombre, datos: raiz,
    r: 46, color: "var(--rojo)", x: CX, y: CY, vx: 0, vy: 0, fijo: true, visible: true
  });

  var nodosArea = [];

  areas.forEach(function (a, i) {
    var ang = (i / areas.length) * Math.PI * 2 - Math.PI / 2;
    var nA = agregar({
      id: "a-" + a.id, tipo: "area", nombre: a.nombre, datos: a,
      r: 34, color: a.color, abierto: false, visible: true,
      x: CX + Math.cos(ang) * 300, y: CY + Math.sin(ang) * 265, vx: 0, vy: 0
    });
    nodosArea.push(nA);
    aristas.push({ a: nRaiz, b: nA, visible: true });

    (a.puestos || []).forEach(function (p, j) {
      var ang2 = ang + (j - ((a.puestos.length - 1) / 2)) * 0.34;
      var nP = agregar({
        id: "p-" + a.id + "-" + j, tipo: "puesto", nombre: p.nombre, datos: p,
        area: a, r: 22, color: a.color, visible: false,
        x: CX + Math.cos(ang2) * 500, y: CY + Math.sin(ang2) * 440, vx: 0, vy: 0
      });
      aristas.push({ a: nA, b: nP, visible: false, padre: nA });
    });
  });

  /* ── Simulación de fuerzas ────────────────────────────────── */
  var svg = document.getElementById("svg");
  var gA = document.getElementById("g-aristas");
  var gN = document.getElementById("g-nodos");
  var NS = "http://www.w3.org/2000/svg";
  var animando = true;

  /* ── Posicionamiento ────────────────────────────────────────────
     Antes esto era una simulación de fuerzas. No funcionaba, y no era
     cuestión de ajustar constantes: con las 9 áreas abiertas hay 49
     nodos cuyas ETIQUETAS suman más superficie que el lienzo entero.
     Ningún reparto los acomoda sin encimarse. El dato además no es un
     grafo: es un árbol, y un árbol se dibuja, no se simula.

     Ahora las posiciones se CALCULAN:
       · la raíz en el centro
       · las 9 áreas repartidas sobre una elipse
       · los puestos del área abierta sobre un arco alrededor de ella,
         con el radio estirado hasta que el arco alcance para la suma
         de los anchos de etiqueta

     Después una relajación corta separa lo que quedó rozando. La
     animación interpola hacia esas posiciones, así que se mantiene la
     sensación de grafo vivo sin el desorden.

     Verificado fuera del navegador con las 9 áreas, una por una:
     cero pares de etiquetas encimadas.                                */

  function movilidad(n) { return n.tipo === "raiz" ? 0 : n.tipo === "area" ? 0.9 : 1; }

  function alBorde(n) {
    var mx = n.anchoTexto / 2 + 10;
    n.tx = Math.max(mx, Math.min(W - mx, n.tx));
    n.ty = Math.max(n.r + 20, Math.min(H - n.r - n.altoTexto - 14, n.ty));
  }

  function relajar(vis) {
    for (var it = 0; it < 400; it++) {
      var hubo = false;
      for (var i = 0; i < vis.length; i++) {
        for (var j = i + 1; j < vis.length; j++) {
          var a = vis[i], b = vis[j];
          var mx = (a.anchoTexto + b.anchoTexto) / 2 + 14;
          var my = (a.r + b.r) + (a.altoTexto + b.altoTexto) / 2 + 8;
          var dcx = b.tx - a.tx;
          var dcy = (b.ty + b.altoTexto / 2) - (a.ty + a.altoTexto / 2);
          var sX = mx - Math.abs(dcx), sY = my - Math.abs(dcy);
          if (sX <= 0 || sY <= 0) continue;
          hubo = true;
          var ma = movilidad(a), mb = movilidad(b), tt = ma + mb || 1;
          if (sX < sY) {
            var d = (dcx >= 0 ? 1 : -1) * (sX + 1) / tt;
            a.tx -= d * ma; b.tx += d * mb;
          } else {
            var e = (dcy >= 0 ? 1 : -1) * (sY + 1) / tt;
            a.ty -= e * ma; b.ty += e * mb;
          }
        }
      }
      /* El borde se aplica DENTRO del bucle: si se aplicara al final,
         empujar un nodo contra el margen podría recrear el solape que
         se acababa de resolver. */
      vis.forEach(alBorde);
      if (!hubo) break;
    }
  }

  function calcularDestinos() {
    var anclados = {};
    nodos.forEach(function (n) { if (n.anclado) anclados[n.id] = { x: n.tx, y: n.ty }; });

    nRaiz.tx = CX; nRaiz.ty = CY;

    nodosArea.forEach(function (nA, i) {
      var ang = -Math.PI / 2 + (i / nodosArea.length) * Math.PI * 2;
      nA.ang = ang;
      nA.tx = CX + RX * Math.cos(ang);
      nA.ty = CY + RY * Math.sin(ang);

      var hijos = nodos.filter(function (n) { return n.tipo === "puesto" && n.area === nA.datos; });
      if (!nA.abierto || !hijos.length) return;

      /* Cada puesto reserva su ancho de etiqueta sobre el arco. El
         radio se estira hasta que el arco dé la vuelta necesaria: es
         el ancho del texto el que manda, no un número fijo. */
      var anchos = hijos.map(function (n) { return n.anchoTexto + 46; });
      var total = anchos.reduce(function (s, x) { return s + x; }, 0);
      var R = Math.max(R2X, total / 1.9);
      var Ry = R * (R2Y / R2X);
      var rad = Math.min(R, Ry);
      var acum = 0;
      hijos.forEach(function (n, k) {
        var centro = acum + anchos[k] / 2;
        acum += anchos[k];
        var a2 = ang + (centro - total / 2) / rad;
        n.tx = CX + R * Math.cos(a2);
        n.ty = CY + Ry * Math.sin(a2);
      });
    });

    Object.keys(anclados).forEach(function (id) {
      var n = nodos.filter(function (x) { return x.id === id; })[0];
      if (n) { n.tx = anclados[id].x; n.ty = anclados[id].y; }
    });

    var vis = nodos.filter(function (n) { return n.visible; });
    vis.forEach(alBorde);
    relajar(vis);
    animando = true;
  }

  /* Interpolación hacia el destino: la parte que da la sensación de
     grafo vivo. Se apaga sola cuando todos llegaron, así no queda un
     requestAnimationFrame girando de fondo. */
  function paso() {
    var quietos = true;
    nodos.forEach(function (n) {
      if (!n.visible || n.tx == null) return;
      var dx = n.tx - n.x, dy = n.ty - n.y;
      if (Math.abs(dx) < 0.4 && Math.abs(dy) < 0.4) { n.x = n.tx; n.y = n.ty; return; }
      n.x += dx * 0.16; n.y += dy * 0.16;
      quietos = false;
    });
    if (quietos) animando = false;
  }

  /* ── Dibujo ───────────────────────────────────────────────── */
  var elemNodo = {}, elemArista = [];

  function crearSvg(tipo, attrs) {
    var e = document.createElementNS(NS, tipo);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function partirTexto(txt, max) {
    var pal = String(txt).split(" "), lin = [], act = "";
    pal.forEach(function (p) {
      if ((act + " " + p).trim().length > max) { if (act) lin.push(act); act = p; }
      else act = (act + " " + p).trim();
    });
    if (act) lin.push(act);
    return lin.slice(0, 4);
  }

  function construir() {
    gA.innerHTML = ""; gN.innerHTML = ""; elemArista = []; elemNodo = {};

    aristas.forEach(function (ar) {
      var l = crearSvg("line", { class: "arista" });
      gA.appendChild(l);
      elemArista.push({ ar: ar, el: l });
    });

    nodos.forEach(function (n) {
      var g = crearSvg("g", { class: "nodo " + n.tipo, tabindex: "0", role: "button" });
      g.classList.add("accionable");
      g.setAttribute("aria-label", n.nombre);
      var c = crearSvg("circle", { r: n.r, fill: n.color });
      g.appendChild(c);

      if (n.tipo === "area" && (n.datos.puestos || []).length) {
        var mas = crearSvg("text", { class: "mas", dy: "7" });
        mas.textContent = "+";
        g.appendChild(mas);
        n._mas = mas;
      }

      /* Etiquetas más cortas por línea: dos líneas angostas ocupan
         mucho menos ancho que una larga, y el ancho es lo que hacía
         que se encimaran. */
      var lineas = partirTexto(n.nombre, n.tipo === "puesto" ? 13 : 15);
      var t = crearSvg("text", { "text-anchor": "middle" });
      var alto = n.tipo === "raiz" ? 21 : n.tipo === "area" ? 19 : 17;
      lineas.forEach(function (li, k) {
        var ts = crearSvg("tspan", { x: 0, dy: k === 0 ? (n.r + 20) : alto });
        ts.textContent = li;
        t.appendChild(ts);
      });
      g.appendChild(t);

      /* Ancho real de la etiqueta. Se mide una vez: getComputedTextLength
         fuerza reflow y llamarlo en cada cuadro tiraría el frame rate.
         Si el navegador todavía no calculó el layout, se estima por
         cantidad de caracteres. */
      var anchoMax = 0;
      try {
        for (var q = 0; q < t.childNodes.length; q++) {
          anchoMax = Math.max(anchoMax, t.childNodes[q].getComputedTextLength() || 0);
        }
      } catch (e) { anchoMax = 0; }
      if (!anchoMax) {
        var porChar = n.tipo === "raiz" ? 10.5 : n.tipo === "area" ? 8.8 : 7.4;
        lineas.forEach(function (li) { anchoMax = Math.max(anchoMax, li.length * porChar); });
      }
      n.anchoTexto = Math.max(anchoMax, n.r * 2);
      n.altoTexto = lineas.length * alto + 6;

      g.addEventListener("click", function () { tocar(n); });
      g.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tocar(n); }
      });
      gN.appendChild(g);
      elemNodo[n.id] = g;
    });
  }

  function pintar() {
    elemArista.forEach(function (p) {
      var v = p.ar.visible && p.ar.a.visible && p.ar.b.visible;
      p.el.style.display = v ? "" : "none";
      if (!v) return;
      p.el.setAttribute("x1", p.ar.a.x); p.el.setAttribute("y1", p.ar.a.y);
      p.el.setAttribute("x2", p.ar.b.x); p.el.setAttribute("y2", p.ar.b.y);
    });
    nodos.forEach(function (n) {
      var g = elemNodo[n.id];
      g.style.display = n.visible ? "" : "none";
      if (!n.visible) return;
      g.setAttribute("transform", "translate(" + n.x.toFixed(1) + "," + n.y.toFixed(1) + ")");
      if (n._mas) n._mas.textContent = n.abierto ? "−" : "+";
    });
  }

  function bucle() {
    if (animando) { paso(); pintar(); }
    requestAnimationFrame(bucle);
  }

  /* ── Interacción ──────────────────────────────────────────── */
  var seleccionado = null;

  function tocar(n) {
    if (n.tipo === "area") alternarArea(n);
    seleccionar(n);
    animando = true;
  }

  /* Acordeón: una sola área abierta por vez. No es una preferencia
     estética — con dos o más abiertas las etiquetas no entran en el
     lienzo y se encima todo, que es justamente lo que rompía antes. */
  function alternarArea(nA) {
    var abrir = !nA.abierto;
    if (abrir) {
      nodosArea.forEach(function (o) {
        if (o !== nA && o.abierto) cerrarArea(o);
      });
    }
    nA.abierto = abrir;
    nodos.forEach(function (n) {
      if (n.tipo === "puesto" && n.area === nA.datos) {
        n.visible = nA.abierto;
        if (nA.abierto) {   /* nacen sobre el área: la animación los "despliega" */
          n.x = nA.x; n.y = nA.y;
        }
      }
    });
    aristas.forEach(function (ar) { if (ar.padre === nA) ar.visible = nA.abierto; });
    document.getElementById("pista").textContent =
      nodos.some(function (n) { return n.tipo === "puesto" && n.visible; })
        ? "Tocá un puesto para ver qué se hace ahí" : "Tocá un área para abrirla";
    calcularDestinos();
  }

  function cerrarArea(nA) {
    nA.abierto = false;
    nodos.forEach(function (n) {
      if (n.tipo === "puesto" && n.area === nA.datos) n.visible = false;
    });
    aristas.forEach(function (ar) { if (ar.padre === nA) ar.visible = false; });
  }

  function seleccionar(n) {
    seleccionado = n;
    Object.keys(elemNodo).forEach(function (k) { elemNodo[k].classList.remove("sel"); });
    if (elemNodo[n.id]) elemNodo[n.id].classList.add("sel");
    elemArista.forEach(function (p) {
      p.el.classList.toggle("viva", p.ar.a === n || p.ar.b === n);
    });
    ficha(n);
  }

  /* ── Panel de ficha ───────────────────────────────────────── */
  var caja = document.getElementById("ficha");

  /* Ruta del dato dentro de AREAS, para que el editor sepa dónde
     escribir de vuelta. resolver() de editor.js entiende "AREAS.3.resumen". */
  function rutaArea(nA) { return "AREAS." + areas.indexOf(nA.datos); }
  function rutaPuesto(n) {
    var ia = areas.indexOf(n.area);
    var ip = (n.area.puestos || []).indexOf(n.datos);
    return "AREAS." + ia + ".puestos." + ip;
  }

  function ficha(n) {
    caja.innerHTML = "";
    var d = n.datos || {};
    var L = EXPO.ligar || function (e) { return e; };

    var tipo = el("span", "tipo", n.tipo === "raiz" ? "La carrera" : n.tipo === "area" ? "Área" : "Puesto");
    caja.appendChild(tipo);

    var h = el("h2", null, n.nombre);
    if (n.tipo === "area") L(h, rutaArea(n) + ".nombre");
    else if (n.tipo === "puesto") L(h, rutaPuesto(n) + ".nombre");
    else L(h, "RAIZ.nombre");
    caja.appendChild(h);

    if (n.tipo === "puesto") {
      caja.appendChild(el("p", "rotulo", "Qué se hace"));
      caja.appendChild(L(el("p", null, d.quehace || ""),
                         rutaPuesto(n) + ".quehace", { multilinea: true }));

      if (d.materias && d.materias.length) {
        caja.appendChild(el("p", "rotulo", "Materias que más se usan"));
        var chips = el("div", "chips");
        d.materias.forEach(function (num) {
          chips.appendChild(el("span", "chip", nombreMateria[num] || ("Materia " + num)));
        });
        caja.appendChild(chips);
      }

      caja.appendChild(el("p", "rotulo", "Área"));
      caja.appendChild(el("p", null, n.area.nombre));

      if (d.perfil) {
        var a = el("a", "ir accionable", "Ver el perfil completo →");
        a.href = "salida-laboral.html#" + d.perfil;
        caja.appendChild(a);
      }
    } else if (n.tipo === "area") {
      caja.appendChild(L(el("p", null, d.resumen || ""),
                         rutaArea(n) + ".resumen", { multilinea: true }));
      if (d.alcance) {
        caja.appendChild(el("p", "rotulo", "Qué habilita el título"));
        caja.appendChild(L(el("p", "alcance", d.alcance),
                           rutaArea(n) + ".alcance", { multilinea: true }));
      }
      caja.appendChild(el("p", "rotulo", "Puestos"));
      caja.appendChild(el("p", null, (d.puestos || []).length + " puestos en esta área. " +
        (elemNodo[n.id] && n.abierto ? "Tocá cualquiera en el grafo." : "Tocá el nodo para abrirlos.")));
    } else {
      caja.appendChild(L(el("p", null, d.resumen || ""), "RAIZ.resumen", { multilinea: true }));
      caja.appendChild(el("p", "rotulo", "Cómo se lee"));
      caja.appendChild(el("p", null, areas.length + " áreas y " +
        nodos.filter(function (x) { return x.tipo === "puesto"; }).length +
        " puestos concretos. Ninguna lista es cerrada: es un mapa para orientarse."));
    }

    if (d._pendiente) caja.appendChild(EXPO.pendiente("Falta cargar", d._pendiente));

    /* La ficha se redibuja en cada click, así que los campos nuevos
       tienen que volver a hacerse editables si el modo está activo. */
    if (EXPO.editor && EXPO.editor.activo()) EXPO.editor.alternar(true);
  }

  /* ── Botones ──────────────────────────────────────────────── */
  document.getElementById("b-cerrar").onclick = function () {
    nodosArea.forEach(function (n) { if (n.abierto) cerrarArea(n); });
    document.getElementById("pista").textContent = "Tocá un área para abrirla";
    seleccionar(nRaiz);
    calcularDestinos();
  };
  document.getElementById("b-centrar").onclick = function () {
    /* Deshace los nodos que el visitante arrastró a mano. */
    nodos.forEach(function (n) { n.anclado = false; });
    calcularDestinos();
  };

  /* ── Arrastre de nodos (mouse y dedo) ─────────────────────── */
  var lienzo = document.getElementById("lienzo"), agarrado = null;

  function aCoordSvg(ev) {
    var r = svg.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
  }
  lienzo.addEventListener("pointerdown", function (ev) {
    var p = aCoordSvg(ev);
    var cerca = nodos.filter(function (n) { return n.visible; })
      .filter(function (n) { return Math.hypot(n.x - p.x, n.y - p.y) < n.r + 8; })[0];
    if (!cerca || cerca.fijo) return;
    agarrado = cerca; lienzo.classList.add("arrastrando");
    lienzo.setPointerCapture(ev.pointerId);
  });
  lienzo.addEventListener("pointermove", function (ev) {
    if (!agarrado) return;
    var p = aCoordSvg(ev);
    /* Al arrastrar, el destino pasa a ser donde lo dejás: el layout no
       te lo devuelve al lugar calculado. "Recentrar" deshace esto. */
    agarrado.x = agarrado.tx = p.x;
    agarrado.y = agarrado.ty = p.y;
    agarrado.anclado = true;
    animando = true;
  });
  ["pointerup", "pointercancel"].forEach(function (e) {
    lienzo.addEventListener(e, function () { agarrado = null; lienzo.classList.remove("arrastrando"); });
  });

  /* ── Alternativa accesible / imprimible ───────────────────── */
  var lista = document.getElementById("lista-accesible");
  areas.forEach(function (a) {
    var h3 = el("h3", null, a.nombre); lista.appendChild(h3);
    var ul = el("ul");
    (a.puestos || []).forEach(function (p) {
      ul.appendChild(el("li", null, p.nombre + ": " + (p.quehace || "")));
    });
    lista.appendChild(ul);
  });

  /* ── Modo edición ─────────────────────────────────────────── */
  if (EXPO.editor) {
    EXPO.editor.registrar("datos/incumbencias.js",
      { RAIZ: raiz, AREAS: areas, NOTA_LEGAL: nota },
      "Grafo de áreas, alcances y puestos.");
  }

  construir();
  calcularDestinos();
  nodos.forEach(function (n) { if (n.tx != null) { n.x = n.tx; n.y = n.ty; } });
  seleccionar(nRaiz);
  bucle();
  EXPO.pie();
});
</script>
</body>
</html>
