<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electivas · Expo UTN 2026</title>
<link rel="stylesheet" href="../css/base.css?v=20260913i">
</head>
<body>

<section class="portada">
  <div class="envoltorio">
    <p class="epigrafe">08 · Electivas</p>
    <h1>Armá tu propio recorrido</h1>
    <p class="bajada">Qué son, cómo funcionan y qué especializaciones habilitan.</p>
  </div>
</section>

<section class="bloque">
  <div class="envoltorio">
    <div class="rejilla dos" id="contenido"></div>
  </div>
</section>

<script src="../js/config.js?v=20260913i"></script>
<script src="../js/comun.js?v=20260913i"></script>
<script src="../js/api.js?v=20260913i"></script>
<script src="../js/editor.js?v=20260913i"></script>
<script src="../datos/electivas.js?v=20260913i"></script>
<script>
/* Plantilla mínima: toma la lista BLOQUES del archivo de datos y la
   renderiza como tarjetas. Mismo patrón que el resto de los módulos:
   para cargar contenido se edita datos/electivas.js, nunca este HTML. */
EXPO.alCargarDatos(function () {
  var el = EXPO.el, esc = EXPO.esc;
  EXPO.cabecera("Electivas");
  var c = document.getElementById("contenido");
  var L = EXPO.ligar || function (e) { return e; };

  (window.BLOQUES || []).forEach(function (b, ib) {
    var t = el("article", "tarjeta");
    /* Se arma con nodos y no con innerHTML porque cada campo se enlaza
       al dato: sin eso el modo edición no tiene dónde escribir y los
       textos se ven pero no se pueden tocar. */
    t.appendChild(L(el("h3", null, b.titulo || ""), "BLOQUES." + ib + ".titulo"));
    t.appendChild(L(el("p", null, b.texto || ""), "BLOQUES." + ib + ".texto", { multilinea: true }));
    if (b.items && b.items.length) {
      var ul = el("ul", "lista-limpia"); ul.style.marginTop = "14px";
      b.items.forEach(function (i, ii) {
        ul.appendChild(L(el("li", null, i), "BLOQUES." + ib + ".items." + ii));
      });
      t.appendChild(ul);
    }
    if (b.video && b.video.src) {
      var v = document.createElement("video");
      v.src = b.video.src; if (b.video.poster) v.poster = b.video.poster;
      v.controls = true; v.preload = "none"; v.playsInline = true;
      v.style.cssText = "width:100%;border-radius:8px;background:#000;margin-top:14px";
      t.appendChild(v);
      if (b.video.pie) t.appendChild(el("p", "nota", b.video.pie));
    }
    if (b.url && b.qr) t.appendChild(EXPO.filaQr(b.qr, b.url, b.leyenda || ""));
    if (b._pendiente) t.appendChild(EXPO.pendiente("Falta cargar", b._pendiente));
    c.appendChild(t);
  });
  if (!c.children.length) {
    c.appendChild(EXPO.pendiente("Sección vacía",
      "Cargá los bloques en datos/electivas.js. La estructura ya está lista."));
  }
  if (EXPO.editor) EXPO.editor.registrar("datos/electivas.js", { BLOQUES: window.BLOQUES || [] }, "Contenido de Electivas.");
  EXPO.pie();
});
</script>
</body>
</html>
