<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materias · Expo UTN 2026</title>
<link rel="stylesheet" href="../css/base.css">
<style>
.mat-card{position:relative}
.mat-card .cab{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.mat-card .num{font-family:var(--mono);font-size:var(--t-sm);color:var(--apagado)}
.mat-card h3{font-size:var(--t-lg);flex:1}
.docentes{margin-top:16px;padding-top:14px;border-top:1px solid var(--gris-2)}
.docentes h4{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.1em;color:var(--apagado);margin-bottom:8px}
.docentes li{font-size:var(--t-sm)}
.docentes li span{color:var(--apagado)}
.correlativas{font-size:var(--t-sm);color:var(--apagado);margin-top:12px}
.correlativas b{color:var(--tinta-2);font-weight:600}
.conteo{font-size:var(--t-sm);color:var(--apagado);margin-bottom:18px}
</style>
</head>
<body>

<section class="portada">
  <div class="envoltorio">
    <p class="epigrafe">02 · Materias</p>
    <h1>Las 36 materias, una por una</h1>
    <p class="bajada">Qué se ve en cada una, qué necesitás antes y quiénes la dan.
      Filtrá por año para ver el recorrido de a un nivel.</p>
  </div>
</section>

<section class="bloque">
  <div class="envoltorio">
    <div class="filtros" id="filtros"></div>
    <p class="conteo" id="conteo"></p>
    <div class="rejilla dos" id="materias"></div>
  </div>
</section>

<script src="../js/config.js"></script>
<script src="../js/comun.js"></script>
<script src="../js/editor.js"></script>
<script src="../datos/plan-estudios.js"></script>
<script src="../datos/materias.js"></script>
<script>
(function () {
  var el = EXPO.el, esc = EXPO.esc;
  EXPO.cabecera("Materias");
  EXPO.editor.registrar("datos/materias.js", { DETALLE_MATERIAS: DETALLE_MATERIAS },
    "Equipo docente, fotos y proyectos por materia.");
  EXPO.editor.registrar("datos/plan-estudios.js", { MATERIAS: MATERIAS },
    "Descripciones de las materias del plan K23.");

  var porId = {};
  MATERIAS.forEach(function (m) { porId[m.id] = m; });
  var filtro = 0;

  /* ── Filtros por año ───────────────────────────────────────── */
  var cf = document.getElementById("filtros");
  [[0, "Todas"], [1, "1.º año"], [2, "2.º año"], [3, "3.º año"], [4, "4.º año"], [5, "5.º año"]]
    .forEach(function (par) {
      var b = el("button", "boton secundario", par[1]);
      b.setAttribute("aria-pressed", par[0] === 0 ? "true" : "false");
      b.onclick = function () {
        filtro = par[0];
        EXPO.qa("#filtros .boton").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
        pintar();
      };
      cf.appendChild(b);
    });

  /* ── Render ────────────────────────────────────────────────── */
  function nombres(ids) {
    return ids.map(function (i) { return porId[i] ? porId[i].n : "#" + i; }).join(", ");
  }

  function pintar() {
    var c = document.getElementById("materias");
    c.innerHTML = "";
    var lista = MATERIAS.filter(function (m) { return !filtro || m.lv === filtro; });

    document.getElementById("conteo").textContent =
      lista.length + (lista.length === 1 ? " materia" : " materias") +
      (filtro ? " de " + filtro + ".º año" : " en total");

    lista.forEach(function (m) {
      var d = DETALLE_MATERIAS[m.id] || {};
      var t = el("article", "tarjeta mat-card");

      var cab = '<div class="cab"><span class="num">' + m.id + "</span><h3>" + esc(m.n) + "</h3></div>" +
        '<div class="etiquetas" style="margin-top:0">' +
          '<span class="etiqueta">' + m.lv + ".º año</span>" +
          (m.tr ? '<span class="etiqueta roja">Integradora</span>' : "") +
        "</div>" +
        "<p style='margin-top:14px' data-edit='MATERIAS." + (m.id - 1) + ".d'>" + esc(m.d || "") + "</p>";

      var corr = "";
      if (m.c.length) corr += "<b>Cursadas:</b> " + esc(nombres(m.c)) + "<br>";
      if (m.a.length) corr += "<b>Aprobadas:</b> " + esc(nombres(m.a));
      if (!corr) corr = "Sin correlativas: se puede cursar desde el arranque.";
      cab += '<p class="correlativas">' + corr + "</p>";

      t.innerHTML = cab;

      var doc = el("div", "docentes");
      doc.appendChild(el("h4", null, "Equipo docente"));
      if (d.docentes && d.docentes.length) {
        var ul = el("ul", "lista-limpia");
        d.docentes.forEach(function (p) {
          var li = el("li");
          li.innerHTML = esc(p.n) + " <span>· " + esc(p.cargo) + "</span>";
          ul.appendChild(li);
        });
        doc.appendChild(ul);
      } else {
        doc.appendChild(EXPO.pendiente("Sin cargar",
          "Agregar el equipo en datos/materias.js, clave " + m.id + "."));
      }
      t.appendChild(doc);

      if (!DETALLE_MATERIAS[m.id]) DETALLE_MATERIAS[m.id] = { docentes: [], fotos: [], proyectos: [] };
      if (!DETALLE_MATERIAS[m.id].fotos) DETALLE_MATERIAS[m.id].fotos = [];
      var cf2 = el("div"); cf2.style.marginTop = "16px"; t.appendChild(cf2);
      EXPO.editor.carruselEditable(cf2, DETALLE_MATERIAS[m.id].fotos,
        "DETALLE_MATERIAS." + m.id + ".fotos",
        function (c, lst) { if (lst.length) { var dd = el("div"); c.appendChild(dd); EXPO.carrusel(dd, lst, { mandos: false }); } },
        "materias");

      if (d.proyectos && d.proyectos.length) {
        var pr = el("div", "docentes");
        pr.appendChild(el("h4", null, "Proyectos de la cátedra"));
        var ul2 = el("ul", "lista-limpia");
        d.proyectos.forEach(function (p) {
          var li = el("li");
          li.innerHTML = "<strong>" + esc(p.titulo) + "</strong><br><span class='nota'>" +
            esc(p.texto || "") + (p.autores ? " · " + esc(p.autores) : "") + "</span>";
          ul2.appendChild(li);
        });
        pr.appendChild(ul2);
        t.appendChild(pr);
      }

      if (d.programa) {
        var a = el("a", "nota", "Programa analítico oficial (PDF)");
        a.href = d.programa; a.target = "_blank"; a.rel = "noopener";
        a.style.display = "inline-block"; a.style.marginTop = "14px";
        t.appendChild(a);
      }

      c.appendChild(t);
    });
  }

  pintar();
  EXPO.pie("Descripciones y correlativas provienen de datos/plan-estudios.js. " +
           "El equipo docente se carga en datos/materias.js.");
})();
</script>
</body>
</html>
